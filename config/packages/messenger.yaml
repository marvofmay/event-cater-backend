framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    - App\Module\Saas\Infrastructure\TenantMiddleware
                    - validation
                    - doctrine_transaction
            query.bus:
                middleware:
                    - App\Module\Saas\Infrastructure\TenantMiddleware
                    - validation
                default_middleware: allow_no_handlers
            event.bus:
                middleware:
                    - App\Module\Saas\Infrastructure\TenantMiddleware
        transports:
            password_reset:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%/password_reset'
                retry_strategy:
                    max_retries: 2
                    delay: 1000
                options:
                    exchange:
                        name: password_reset
                        type: direct
            send_sms:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%/send_sms'
                retry_strategy:
                    max_retries: 2
                options:
                    exchange:
                        name: send_sms
                        type: direct
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            company_xlsx_import:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%/company_xlsx_import'
                options:
                    exchange:
                        name: 'company_xlsx_import' # Nazwa exchange (wymiana)
                        type: direct # Typ exchange (direct, fanout, topic itp.)
            department_xlsx_import:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%/department_xlsx_import'
                options:
                    exchange:
                        name: 'department_xlsx_import'
                        type: direct
            employee_xlsx_import:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%/employee_xlsx_import'
                options:
                    exchange:
                        name: 'employee_xlsx_import'
                        type: direct
            send_email:
              dsn: '%env(MESSENGER_TRANSPORT_DSN)%/send_email'
              options:
                exchange:
                  name: 'send_email'
                  type: direct
            push_notification:
              dsn: '%env(MESSENGER_TRANSPORT_DSN)%/push_notification'
              options:
                exchange:
                  name: 'push_notification'
                  type: direct
        routing:
            'App\Module\System\Application\Command\Auth\RequestPasswordResetCommand': password_reset
            'App\Module\System\Application\Command\Auth\PasswordChangedNoticeCommand': password_reset
            'App\Module\System\Application\Command\Sms\SendBrevoSmsCommand': send_sms
            'App\Module\Company\Application\Command\Company\ImportCompaniesCommand': company_xlsx_import
            'App\Module\Company\Application\Command\Department\ImportDepartmentsCommand': department_xlsx_import
            'App\Module\Company\Application\Command\Employee\ImportEmployeesCommand': employee_xlsx_import
            'App\Module\System\Application\Command\Email\SendEmailCommand': send_email
            'App\Module\Messaging\Application\Command\NotifyDirectMessageRecipients': push_notification
            'App\Module\Messaging\Application\Command\NotifySystemNotificationRecipients': push_notification

when@test:
    framework:
        messenger:
            transports:
                password_reset: 'in-memory://'
                # Don't handle push inside the request transaction (TenantMiddleware cannot switch DB mid-tx).
                push_notification: 'in-memory://'

